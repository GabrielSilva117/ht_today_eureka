global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Eureka server's own metrics (Prometheus itself isn't registered in Eureka)
  - job_name: 'eureka-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['eureka-server:8761']

  # hardware-today-back (the monolith) is a separate compose project and a
  # Feign *client* of the gateway/Eureka mesh, not a member of it - it never
  # registers in Eureka, so it can't be picked up by eureka-sd-services below.
  # Reachable because it sits on the shared external ht_network.
  - job_name: 'hardware-today-back'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['hardware-today-back:8080']

  # Auto-discover every service registered in Eureka and scrape its
  # /actuator/prometheus endpoint (or metadata-provided override)
  - job_name: 'eureka-sd-services'
    eureka_sd_configs:
      - server: 'http://eureka-server:8761/eureka'
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_eureka_app_name]
        target_label: job
      - source_labels: [__meta_eureka_app_instance_hostname]
        target_label: instance
      # default metrics path unless overridden via eureka instance metadata
      # key "prometheus.path" (eureka.instance.metadata-map.prometheus.path)
      - source_labels: [__meta_eureka_app_instance_metadata_prometheus_path]
        target_label: __metrics_path__
        regex: '(.+)'
      - target_label: __metrics_path__
        regex: '^$'
        replacement: '/actuator/prometheus'
      # default target is host:eureka-port unless overridden via metadata
      # key "prometheus.port" (for services with a separate management port)
      - source_labels: [__meta_eureka_app_instance_hostname, __meta_eureka_app_instance_metadata_prometheus_port]
        regex: '(.+);(.+)'
        target_label: __address__
        replacement: '${1}:${2}'
      - source_labels: [__address__]
        regex: '^$|^;.*'
        target_label: __address__
        replacement: ''
